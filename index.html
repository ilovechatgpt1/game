<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d1c"><meta name="description" content="لعبة مهمة النجاة — اجمع النجوم وتفادى النيازك."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>مهمة النجاة</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2b50,#090d1c 65%);color:#f5f7ff;font-family:system-ui;display:flex;justify-content:center;min-height:100vh}.app{width:min(100%,560px);padding:14px;display:flex;flex-direction:column;gap:12px}header,.stats,.controls{display:flex;gap:9px;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.brand span{color:#54e6ff}.tag,.stat{background:#ffffff10;border:1px solid #ffffff20;border-radius:14px;padding:9px}.stats .stat{flex:1;text-align:center}.stat small{display:block;color:#aab7d8;font-size:11px}.stat b{font-size:21px}.arena{position:relative;height:min(60vh,620px);min-height:390px;border:1px solid #54e6ff66;border-radius:22px;overflow:hidden;background:#080d20;box-shadow:0 18px 55px #0008}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#080d20c9;backdrop-filter:blur(7px)}.hidden{display:none!important}.box{max-width:330px}.box h1{font-size:30px;margin:0 0 8px}.box p{color:#bdc9e7;line-height:1.7;margin:6px 0 18px}button{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;color:#06101b;background:linear-gradient(110deg,#54e6ff,#91f7df);cursor:pointer}.secondary{background:#ffffff12;color:#eaf3ff;border:1px solid #ffffff24}.controls button{flex:1}.hint{text-align:center;color:#91a1c7;font-size:12px}
</style><main class="app"><header><div class="brand">مهمة <span>النجاة</span></div><div class="tag">ARCADE • 01</div></header><section class="stats"><div class="stat"><small>النقاط</small><b id="score">0</b></div><div class="stat"><small>أفضل نتيجة</small><b id="best">0</b></div><div class="stat"><small>القلوب</small><b id="lives">♥♥♥</b></div></section><div class="arena" id="arena"><canvas id="game"></canvas><div class="overlay" id="start"><div class="box"><h1>جاهز للتحدّي؟</h1><p>حرّك المركبة يمين ويسار، اجمع النجوم الذهبية وتفادى النيازك الحمراء. كلما تصمد أكثر، تزيد السرعة!</p><button id="play">ابدأ اللعب</button></div></div><div class="overlay hidden" id="over"><div class="box"><h1>انتهت المهمة!</h1><p id="result"></p><button id="again">حاول مرة ثانية</button></div></div></div><div class="controls"><button class="secondary" id="left">◀ يسار</button><button class="secondary" id="right">يمين ▶</button></div><div class="hint">اسحب المركبة بإصبعك أو استخدم الأزرار</div></main>
<script>(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),arena=document.querySelector('#arena'),$=id=>document.getElementById(id);let W,H,d=1,p,things=[],score=0,lives=3,speed=2.5,spawn=0,last=0,run=false,L=false,R=false,best=+(localStorage.bestNajah||0);$('best').textContent=best;
function size(){let r=arena.getBoundingClientRect();W=r.width;H=r.height;d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);if(p)p.y=H-65}new ResizeObserver(size).observe(arena);size();
function stats(){$('score').textContent=score;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function reset(){score=0;lives=3;speed=2.5;spawn=0;things=[];p={x:W/2,y:H-65};stats()}
function bg(t){x.fillStyle='#080d20';x.fillRect(0,0,W,H);for(let i=0;i<65;i++){x.fillStyle=i%4?'#ffffff55':'#54e6ff77';x.fillRect(i*79.7%W,(i*131.3+t*.025)%H,1.5,1.5)}}
function ship(){x.save();x.translate(p.x,p.y);x.shadowBlur=20;x.shadowColor='#54e6ff';x.fillStyle='#54e6ff';x.beginPath();x.moveTo(0,-21);x.lineTo(17,15);x.lineTo(0,9);x.lineTo(-17,15);x.closePath();x.fill();x.fillStyle='white';x.beginPath();x.arc(0,-3,5,0,7);x.fill();x.fillStyle='#ff9d54';x.beginPath();x.moveTo(-5,14);x.lineTo(0,27+Math.random()*5);x.lineTo(5,14);x.fill();x.restore()}
function item(o){x.save();x.translate(o.x,o.y);x.rotate(o.rot);if(o.star){x.shadowBlur=18;x.shadowColor='#ffd166';x.fillStyle='#ffd166';x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?5:11;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()}else{x.shadowBlur=12;x.shadowColor='#ff5e9c';x.fillStyle='#df526f';x.beginPath();x.arc(0,0,14,0,7);x.fill()}x.restore()}
function end(){run=false;best=Math.max(best,score);localStorage.bestNajah=best;$('best').textContent=best;$('result').textContent=`نتيجتك ${score} نقطة${score===best?' — رقم قياسي جديد!':''}`;$('over').classList.remove('hidden')}
function frame(now){if(!run)return;let dt=Math.min((now-last)/16.67,2);last=now;speed+=.0015*dt;bg(now);if(L)p.x-=5*dt;if(R)p.x+=5*dt;p.x=Math.max(20,Math.min(W-20,p.x));if(++spawn>Math.max(19,48-score*.12)){spawn=0;things.push({x:24+Math.random()*(W-48),y:-25,star:Math.random()<.34,rot:Math.random()*6})}for(let i=things.length-1;i>=0;i--){let o=things[i];o.y+=(speed+(o.star?0:1))*dt;o.rot+=.025*dt;if(Math.hypot(o.x-p.x,o.y-p.y)<25){if(o.star)score+=10;else lives--;things.splice(i,1);stats();if(lives<=0){end();return}}else if(o.y>H+30)things.splice(i,1);else item(o)}ship();requestAnimationFrame(frame)}
function start(){reset();run=true;$('start').classList.add('hidden');$('over').classList.add('hidden');last=performance.now();requestAnimationFrame(frame)}
function move(e){let r=c.getBoundingClientRect();p.x=Math.max(20,Math.min(W-20,e.clientX-r.left))}let drag=false;c.onpointerdown=e=>{if(run){drag=true;c.setPointerCapture(e.pointerId);move(e)}};c.onpointermove=e=>{if(drag&&run)move(e)};c.onpointerup=c.onpointercancel=()=>drag=false;
function hold(id,dir){$(id).onpointerdown=e=>{e.preventDefault();window[dir]=true};['pointerup','pointerleave','pointercancel'].forEach(k=>$(id).addEventListener(k,()=>window[dir]=false))}hold('left','L');hold('right','R');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')L=true;if(e.key==='ArrowRight')R=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')L=false;if(e.key==='ArrowRight')R=false});$('play').onclick=start;$('again').onclick=start;reset();bg(0);ship()})();if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script></html>
